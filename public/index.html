<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Notes App - Ultra-Lightweight & Portable</title>
  <link rel="icon" type="image/svg+xml" href="./icons/logo.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <link rel="apple-touch-icon" href="./icons/logo.svg">
  <link rel="stylesheet" href="./styles.css?v=4.8.4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('notes_app_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
</head>
<body data-layout="layout-a">
  <!-- Instant Native Startup Splash Screen (Zero White Flash, Browser Cached) -->
  <div id="app-splash-overlay" class="app-splash-overlay theme-dark">
    <div class="splash-aurora"></div>
    <div class="splash-3d-stage">
      <div class="splash-ink-ripple"></div>
      <svg class="splash-logo-art" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="splashBookGrad" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
        <rect x="8" y="10" width="48" height="44" rx="10" fill="url(#splashBookGrad)" fill-opacity="0.18" stroke="#6366f1" stroke-width="2.5"/>
        <path d="M32 12V52" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
        <path class="splash-draw-stroke" d="M18 36C22 30 26 24 32 24C38 24 40 32 46 22" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="splash-nib-dot" cx="46" cy="22" r="3.5" fill="#38bdf8"/>
      </svg>
      <div class="splash-nib-spark"></div>
    </div>
    <div class="splash-brand-text">Notes App</div>
    <div class="splash-whisper-text" id="app-splash-whisper">Preparing your infinite canvas...</div>
    <div class="splash-progress-track">
      <div class="splash-progress-fill"></div>
    </div>
  </div>

  <div id="app-container">
    
    <!-- Top Master App Bar -->
    <header id="top-bar">
      <!-- Left: Sidebar Toggle & Notebook Selector -->
      <div class="header-left">
        <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle Navigation Sidebar (Ctrl+\)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="notebook-dropdown-wrapper">
          <svg class="notebook-brand-icon" width="18" height="18" viewBox="0 0 64 64" fill="none" style="vertical-align: middle; margin-right: 6px; flex-shrink: 0;">
            <rect x="8" y="10" width="48" height="44" rx="10" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="3"/>
            <path d="M32 12V52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
            <path d="M18 36C22 30 26 24 32 24C38 24 40 32 46 22" stroke="var(--accent-color, #6366f1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="46" cy="22" r="3.5" fill="#38bdf8"/>
          </svg>
          <select id="notebook-select" title="Active Notebook">
            <option value="nb_physics">Physics & Calculus 101</option>
          </select>
        </div>
        <div class="notebook-quick-actions">
          <button id="btn-new-notebook" class="icon-btn-sm" title="New Notebook (+)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button id="btn-rename-notebook" class="icon-btn-sm" title="Rename Active Notebook (✏️)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <button id="btn-delete-notebook" class="icon-btn-sm text-danger" title="Delete Active Notebook (🗑️)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
        <span class="badge" id="storage-status">Local Saved</span>
      </div>



      <!-- Right: Navigate vs. Ink Mode & Settings -->
      <div class="header-right">
        <div class="mode-pill-toggle">
          <button id="btn-mode-win" class="pill-btn active" title="Navigate Mode: Smooth touch pan, zoom & keyboard editing">
            <span class="pill-icon">💻</span>
            <span class="pill-text">Navigate</span>
          </button>
          <button id="btn-mode-ipad" class="pill-btn" title="Ink Mode: Dedicated Apple Pencil & stylus writing">
            <span class="pill-icon">✏️</span>
            <span class="pill-text">Ink Mode</span>
          </button>
        </div>
        <button id="btn-install-app" class="icon-btn pwa-install-btn" title="Install Standalone App (Zero Browser Bars)" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button id="btn-theme-toggle" class="icon-btn" title="Toggle Dark / Light Mode">
          <span id="theme-toggle-icon" style="font-size: 1rem; line-height: 1;">🌙</span>
        </button>
        <button id="btn-storage-settings" class="icon-btn" title="Storage & Vault Settings">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Floating, User-Draggable Quick-Toggle Puck (Parkable Anywhere) -->
    <div id="floating-mode-puck" class="floating-puck" title="Drag anywhere to park. Tap to toggle Navigate vs Ink Mode">
      <span id="puck-icon" class="puck-icon">✏️</span>
      <span id="puck-label" class="puck-label">Ink Mode</span>
      <span class="puck-drag-dots" title="Drag handle">⋮⋮</span>
    </div>

    <!-- Zone 1: Dedicated Typography & Tools Ribbon (Visible in Layout A) -->
    <div id="ribbon-bar" data-tab="home">
      <!-- Undo / Redo Cluster -->
      <div class="ribbon-cluster">
        <button id="btn-undo" class="fmt-btn" title="Undo (Ctrl+Z)">↺</button>
        <button id="btn-redo" class="fmt-btn" title="Redo (Ctrl+Y)">↻</button>
      </div>

      <!-- MS Word-Style Ribbon Tab Switcher (Home vs Insert) -->
      <div class="ribbon-tabs-nav">
        <button id="tab-btn-home" class="ribbon-tab-btn active" title="Text Formatting & Typography">Home</button>
        <button id="tab-btn-insert" class="ribbon-tab-btn" title="Insert Notes, Media, Tables & Content">Insert</button>
      </div>

      <!-- Windows Mode: Typography & Text Editing Controls (Home Tab) -->
      <div id="ribbon-text-group" class="ribbon-mode-group">
        <!-- Font Family & Size Cluster -->
        <div class="ribbon-cluster ribbon-font-cluster">
          <select id="ribbon-font" title="Font Family">
            <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Segoe UI</option>
            <option value="'Calibri', 'Segoe UI', sans-serif">Calibri</option>
            <option value="'Georgia', 'Times New Roman', serif">Georgia</option>
            <option value="'Fira Code', 'Consolas', monospace">Monospace</option>
            <option value="'Caveat', cursive, sans-serif">Handwriting</option>
          </select>
          <select id="ribbon-font-size" title="Font Size">
            <option value="12px">12pt</option>
            <option value="14px">14pt</option>
            <option value="16px" selected>16pt</option>
            <option value="18px">18pt</option>
            <option value="20px">20pt</option>
            <option value="24px">24pt</option>
            <option value="32px">32pt</option>
          </select>
          <select id="ribbon-heading" title="Paragraph Style">
            <option value="p">Normal</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
          </select>
        </div>

        <!-- Formatting cluster (Bold, Italic, Underline, Strikethrough, Color, Highlight) -->
        <div class="ribbon-cluster ribbon-style-cluster">
          <button id="ribbon-bold" class="fmt-btn" title="Bold (Ctrl+B)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
          </button>
          <button id="ribbon-italic" class="fmt-btn" title="Italic (Ctrl+I)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
          </button>
          <button id="ribbon-underline" class="fmt-btn" title="Underline (Ctrl+U)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
          </button>
          <button id="ribbon-strike" class="fmt-btn" title="Strikethrough">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 7.5C17.5 5 15.5 3.5 12 3.5C8 3.5 6.5 5.5 6.5 7.5C6.5 12 17.5 11 17.5 16.5C17.5 19 15.5 20.5 12 20.5C7.5 20.5 6 18.5 6 16.5"></path><line x1="3" y1="12" x2="21" y2="12"></line></svg>
          </button>
          <div class="color-picker-wrapper font-color-picker-wrapper" id="color-picker-wrapper" title="Font Color">
            <button id="ribbon-font-color-btn" class="fmt-btn font-color-main-btn" title="Font Color (Click to apply color)">
              <span class="color-picker-label">A</span>
              <div class="color-bar-indicator" id="ribbon-color-bar" style="background:#0f172a;"></div>
            </button>
            <button id="ribbon-font-color-dropdown-btn" class="dropdown-chevron-btn" title="Choose Font Color">
              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="font-color-palette" class="font-color-palette hidden">
              <button class="fc-swatch active" data-color="#0f172a" style="background:#0f172a;" title="Default Text"></button>
              <button class="fc-swatch" data-color="#1d4ed8" style="background:#1d4ed8;" title="Royal Blue"></button>
              <button class="fc-swatch" data-color="#b91c1c" style="background:#b91c1c;" title="Crimson Red"></button>
              <button class="fc-swatch" data-color="#15803d" style="background:#15803d;" title="Forest Green"></button>
              <button class="fc-swatch" data-color="#7e22ce" style="background:#7e22ce;" title="Purple"></button>
              <button class="fc-swatch" data-color="#c2410c" style="background:#c2410c;" title="Warm Amber"></button>
              <label class="fc-swatch fc-custom-btn" title="Custom Color">
                <span style="font-size:11px;">🎨</span>
                <input type="color" id="ribbon-color" value="#0f172a" style="position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; top:0; left:0;">
              </label>
            </div>
          </div>
          <div class="highlighter-picker-wrapper" id="highlighter-picker-wrapper" title="Highlight Tool">
            <button id="ribbon-highlight" class="fmt-btn highlighter-main-btn" title="Highlight Tool (Click to highlight selection, or click to toggle highlight mode)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 11-6 6v3h9l3-3"></path>
                <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path>
              </svg>
              <div class="color-bar-indicator" id="ribbon-highlight-bar" style="background:#fef08a;"></div>
            </button>
            <button id="ribbon-highlight-dropdown-btn" class="dropdown-chevron-btn" title="Choose Highlighter Color">
              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="highlighter-palette" class="highlighter-palette hidden">
              <button class="hl-swatch active" data-color="#fef08a" style="background:#fef08a;" title="Soft Yellow"></button>
              <button class="hl-swatch" data-color="#bbf7d0" style="background:#bbf7d0;" title="Mint Green"></button>
              <button class="hl-swatch" data-color="#fbcfe8" style="background:#fbcfe8;" title="Blossom Pink"></button>
              <button class="hl-swatch" data-color="#bae6fd" style="background:#bae6fd;" title="Sky Blue"></button>
              <button class="hl-swatch" data-color="#fed7aa" style="background:#fed7aa;" title="Warm Peach"></button>
              <button class="hl-swatch hl-clear-btn" data-color="transparent" title="Remove Highlight">✕</button>
            </div>
          </div>
        </div>

        <!-- Paragraph Alignment & Lists Cluster -->
        <div class="ribbon-cluster ribbon-align-cluster">
          <button id="ribbon-align-left" class="fmt-btn" title="Align Left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
          </button>
          <button id="ribbon-align-center" class="fmt-btn" title="Center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="6" y1="12" x2="18" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
          </button>
          <button id="ribbon-align-right" class="fmt-btn" title="Align Right">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="6" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="v-divider-sm"></div>
          <button id="ribbon-bullet" class="fmt-btn" title="Bullet List">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="9" y1="18" x2="21" y2="18"></line><circle cx="4.5" cy="6" r="1.5" fill="var(--accent-color, #6366f1)"></circle><circle cx="4.5" cy="12" r="1.5" fill="var(--accent-color, #6366f1)"></circle><circle cx="4.5" cy="18" r="1.5" fill="var(--accent-color, #6366f1)"></circle></svg>
          </button>
          <button id="ribbon-num" class="fmt-btn" title="Numbered List">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="10" y1="6" x2="21" y2="6"></line>
              <line x1="10" y1="12" x2="21" y2="12"></line>
              <line x1="10" y1="18" x2="21" y2="18"></line>
              <path d="M4 6h1.5v4"></path>
              <path d="M3.5 10h3"></path>
              <path d="M6 18H3.5c0-1 2.5-2 2.5-3s-1-1.5-2.5-1"></path>
            </svg>
          </button>
          <button id="ribbon-task" class="fmt-btn" title="Task Checkbox">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"></rect><polyline points="8 12 11 15 16 9" stroke="var(--accent-color, #6366f1)" stroke-width="2"></polyline></svg>
          </button>
        </div>
      </div>

      <!-- iPad Mode: Inking, Colors & Advanced Eraser Palette -->
      <div id="ribbon-ink-group" class="ribbon-mode-group" style="display:none;">
        <!-- Tool Switcher (Pen vs Highlighter vs Eraser) -->
        <div class="ribbon-cluster ink-tool-switcher">
          <button id="ink-tool-pen" class="ink-pill-btn active" title="Pen (Draw with Stylus/Mouse)">🖊 Pen</button>
          <button id="ink-tool-highlighter" class="ink-pill-btn" title="Highlighter (Semi-transparent)">🖍 Highlighter</button>
          <button id="ink-tool-eraser" class="ink-pill-btn" title="Eraser">🧹 Eraser</button>
        </div>

        <div class="v-divider"></div>

        <!-- Pen Tip Size & Color Cluster -->
        <div id="pen-controls-cluster" class="ribbon-cluster">
          <span class="ribbon-cluster-label">Tip:</span>
          <div class="ink-size-group">
            <button class="ink-size-btn" data-size="1" title="Extra Fine (1px)">
              <span class="size-dot" style="width:3px; height:3px;"></span>
            </button>
            <button class="ink-size-btn active" data-size="3" title="Fine (3px)">
              <span class="size-dot" style="width:6px; height:6px;"></span>
            </button>
            <button class="ink-size-btn" data-size="6" title="Medium (6px)">
              <span class="size-dot" style="width:9px; height:9px;"></span>
            </button>
            <button class="ink-size-btn" data-size="10" title="Thick (10px)">
              <span class="size-dot" style="width:13px; height:13px;"></span>
            </button>
          </div>

          <span class="ribbon-cluster-label" style="margin-left:6px;">Color:</span>
          <div class="ink-colors-group">
            <button class="ink-swatch active" data-color="#0f172a" style="background:#0f172a;" title="Black"></button>
            <button class="ink-swatch" data-color="#2563eb" style="background:#2563eb;" title="Blue"></button>
            <button class="ink-swatch" data-color="#dc2626" style="background:#dc2626;" title="Red"></button>
            <button class="ink-swatch" data-color="#16a34a" style="background:#16a34a;" title="Green"></button>
            <button class="ink-swatch" data-color="#9333ea" style="background:#9333ea;" title="Purple"></button>
            <button class="ink-swatch" data-color="#facc15" style="background:#facc15;" title="Highlighter"></button>
            <input type="color" id="ink-color-custom" value="#0f172a" class="ink-color-custom-input" title="Custom Color">
          </div>
        </div>

        <!-- Eraser Controls Cluster (Mode & Size) -->
        <div id="eraser-controls-cluster" class="ribbon-cluster" style="display:none;">
          <span class="ribbon-cluster-label">Type:</span>
          <div class="ink-mode-toggle">
            <button id="eraser-mode-full" class="ink-toggle-btn active" title="OneNote-style: Touching any part deletes the whole stroke">⚡ Full Stroke</button>
            <button id="eraser-mode-partial" class="ink-toggle-btn" title="Segment Eraser: Erases only the points under the eraser">✂ Partial Stroke</button>
          </div>

          <div class="v-divider"></div>

          <span class="ribbon-cluster-label">Size:</span>
          <div class="ink-eraser-sizes">
            <button class="ink-eraser-size-btn" data-radius="12" title="Small (12px)">Small</button>
            <button class="ink-eraser-size-btn active" data-radius="24" title="Medium (24px)">Medium</button>
            <button class="ink-eraser-size-btn" data-radius="48" title="Large (48px)">Large</button>
          </div>
        </div>
      </div>

      <!-- Insert Cluster: Universal Container & Mixed Media Tools -->
      <div class="ribbon-cluster insert-cluster">
        <button id="btn-add-note" class="btn btn-sm btn-accent" title="Add Universal Note Box (or double-click anywhere on canvas)">+ New Note</button>
        <button id="btn-browse-media" class="btn btn-sm btn-action" title="Browse Images/Media from your computer">🖼 Media</button>
        <button id="btn-browse-pdf" class="btn btn-sm btn-action" title="Browse PDF document from your computer">📑 PDF</button>
        <button id="btn-insert-sketch" class="btn btn-sm btn-action" title="Insert In-Box Handwriting Canvas into Note">✍ Sketch</button>
        <button id="btn-insert-table" class="btn btn-sm btn-action" title="Insert Table into Note">⊞ Table</button>
        <button id="btn-insert-plot" class="btn btn-sm btn-action" title="Insert Function Plot into Note">📈 Plot</button>
        <button id="btn-add-math" class="btn btn-sm btn-action" title="Insert LaTeX Equation">$fx Math</button>
      </div>

      <!-- Accessible Local File Pickers for Desktop & iPad -->
      <input type="file" id="media-file-input" accept="image/*" class="visually-hidden-file-input" aria-hidden="true">
      <input type="file" id="pdf-file-input" accept="application/pdf, .pdf" class="visually-hidden-file-input" aria-hidden="true">

      <!-- Marquee Multi-Select Status -->
      <div class="ribbon-cluster ml-auto">
        <span id="selection-status" class="selection-indicator">0 selected</span>
        <button id="btn-group-blocks" class="btn btn-sm" title="Group selected blocks (Ctrl+G)">Group</button>
      </div>
    </div>

    <!-- Main Body: Sidebar Hierarchy + Infinite Canvas Workspace -->
    <div id="main-layout-body">
      
      <!-- Zone 2 & 3: 2-Tier Hierarchy Navigation Sidebar -->
      <aside id="app-sidebar">
        <!-- Sections Column -->
        <div id="sections-column">
          <div class="sidebar-header">
            <span>SECTIONS</span>
            <button id="btn-new-section" class="mini-btn" title="New Section">+</button>
          </div>
          <ul id="sections-list" class="sidebar-items">
            <!-- Populated dynamically by HierarchyManager -->
          </ul>
        </div>

        <!-- Pages Column (with Subpage Indentation) -->
        <div id="pages-column">
          <div class="sidebar-header">
            <span>PAGES</span>
            <button id="btn-new-page" class="mini-btn" title="New Page">+</button>
          </div>
          <div class="search-box">
            <input type="text" id="page-search-input" placeholder="Search pages...">
          </div>
          <ul id="pages-list" class="sidebar-items">
            <!-- Populated dynamically by HierarchyManager -->
          </ul>
        </div>
      </aside>

      <!-- Zone 4: Infinite Freeform 2D Canvas Workspace -->
      <main id="canvas-container">
        <!-- Infinite coordinate world transform element -->
        <div id="canvas-world">
          <!-- Interactive Blocks Container -->
          <div id="blocks-container" class="canvas-layer"></div>

          <!-- SVG Layer for Global Vector Annotations (inside world transform for unified 120fps GPU panning) -->
          <svg id="global-annotations-svg" class="vector-annotations-layer"></svg>

          <!-- Multi-selection Elastic Marquee Box -->
          <div id="selection-marquee" class="marquee-box hidden"></div>
        </div>

        <!-- Active iPad Ink Simulation Overlay Canvas -->
        <canvas id="active-draw-canvas" class="hidden"></canvas>

        <!-- Vertical Canvas Position Scrollbar (Locked in Ink Mode) -->
        <div id="canvas-scrollbar-v" class="canvas-scrollbar vertical" title="Vertical Canvas Position">
          <div id="canvas-scroll-thumb-v" class="canvas-scroll-thumb"></div>
        </div>
      </main>
    </div>

    <!-- Bottom Status Bar with Integrated Horizontal Scrollbar -->
    <footer id="status-bar">
      <div class="status-left">
        <span id="page-status-label" title="Current Note Location">Physics &amp; Calculus &gt; Limits &amp; Continuity &gt; Derivatives Intro</span>
      </div>

      <!-- Integrated Horizontal Spatial Scrollbar -->
      <div id="canvas-scrollbar-h" class="canvas-scrollbar horizontal" title="Horizontal Canvas Position">
        <div id="canvas-scroll-thumb-h" class="canvas-scroll-thumb"></div>
      </div>

      <div class="status-right">
        <div class="zoom-popover-wrapper">
          <button id="btn-zoom-pill" class="zoom-pill" title="Tap to adjust Zoom or Fit View">
            <span class="zoom-pill-icon">🔍</span>
            <span id="zoom-indicator">100%</span>
            <span class="zoom-pill-chevron">▾</span>
          </button>
          
          <div id="zoom-flyout" class="zoom-flyout hidden">
            <div class="zoom-flyout-header">Zoom &amp; Canvas View</div>
            <div class="zoom-flyout-row">
              <button id="btn-zoom-out" class="icon-btn-sm" title="Zoom Out (Ctrl+-)">−</button>
              <button id="btn-reset-view" class="btn btn-sm btn-ghost" title="Reset View to 100%">100%</button>
              <button id="btn-zoom-in" class="icon-btn-sm" title="Zoom In (Ctrl++)">+</button>
            </div>
            <button id="btn-zoom-fit" class="btn btn-sm btn-accent-light w-full" title="Zoom to Fit All Content (Shift+1)">
              📐 Fit All Content
            </button>
          </div>
        </div>
      </div>
    </footer>

    <!-- Storage & Data Hub Settings Modal is dynamically mounted by storage_settings_modal.js -->
  </div>

  <script type="module" src="./app.js?v=4.8.1"></script>
</body>
</html>
